# Cloudflare Worker with static assets. Deployed by Workers Builds:
#   build command: npm run build    deploy command: npx wrangler deploy
# IDs here are not secrets: they only work with an authenticated Cloudflare account.
# ACCESS_TEAM_DOMAIN and ACCESS_AUD are set as Worker variables in the dashboard
# (keep_vars preserves them across deploys); the API refuses every request until both exist.
name = "greengirlera-pipeline"
main = "src/worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "greengirlera-crm"
database_id = "67ad28ca-db48-48a7-8455-e3fe703f1248"
migrations_dir = "migrations"
